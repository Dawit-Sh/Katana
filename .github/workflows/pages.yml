# Publishes site/ (the one-page download site) to GitHub Pages: https://dawitsh.dev/Katana/
# Every published release runs it again: it writes site/latest.json (the version, the notes and the three APKs'
# links, sizes and SHA-256 digests, which the in-app updater reads instead of GitHub's API)
# and bakes them into index.html, so the Download button says the newest version from its first frame.
name: Website

on:
  push:
    branches: [fire7]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fire7
      - name: Write latest.json from the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases/latest" | jq '{
            version: (.tag_name | ltrimstr("v")),
            tag: .tag_name,
            published: .published_at,
            page: .html_url,
            notes: .body,
            apks: ([.assets[] | select(.name | endswith(".apk")) | {
              key: (if (.name | test("universal")) then "universal"
                    elif (.name | test("arm64-v8a")) then "arm64"
                    elif (.name | test("armeabi-v7a")) then "fire7"
                    else .name end),
              value: {name, url: .browser_download_url, size, digest}
            }] | from_entries)
          }' > site/latest.json
          cat site/latest.json
      - name: Write the version and links into the page
        run: python3 .github/scripts/bake_site.py site/latest.json site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
